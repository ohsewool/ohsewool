name: counts

# The table on the front page listed 304 / 284 / 177 / 155 / 67 while the
# repositories were at 334 / 410 / 180 / 202 / 98. Each of those five verifies
# its own README against `pytest --collect-only` in its own CI - a check added
# after the count drifted twice - and the page that aggregates them was covered
# by none of it. A guard that stops at the repository boundary leaves the page
# most people read unguarded.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # the table can go stale without anything here changing
  workflow_dispatch:

jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_counts.py
